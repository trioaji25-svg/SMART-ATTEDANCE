
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>My Daily Tasks</h1>
            <p>Atur kegiatanmu setiap hari ✨</p>
        </header>

        <div class="date" id="tanggal"></div>

        <div class="input-area">
            <input
                type="text"
                id="taskInput"
                placeholder="Tuliskan tugasmu..."
            >
            <button onclick="tambahTugas()">+</button>
        </div>

        <div class="task-info">
            <h3>Daftar Tugas</h3>
            <span id="jumlah">0 tugas</span>
        </div>

        <ul id="taskList"></ul>

        <div class="footer">
            <p>Stay productive and keep going! 💙</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
